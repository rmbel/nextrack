name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NEXTTRACK_ONLINE_CATALOG: '0'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv prototype/.venv
      - run: prototype/.venv/bin/python -m pip install -r prototype/requirements-dev.txt
      - run: prototype/.venv/bin/python -m unittest discover -s prototype/tests -v
      - run: prototype/.venv/bin/python prototype/scripts/export_runtime_catalog.py --allow-small-catalogue
      - run: prototype/.venv/bin/python prototype/scripts/verify_runtime_catalog.py --output /tmp/catalogue-equivalence.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv prototype/.venv
      - run: prototype/.venv/bin/python -m pip install -r prototype/requirements-dev.txt
      - run: npm ci
        working-directory: prototype
      - run: npx playwright install --with-deps chrome
        working-directory: prototype
      - run: npm run test:ui
        working-directory: prototype
